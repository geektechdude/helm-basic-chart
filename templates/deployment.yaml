apiVersion: apps/v1
kind: Deployment
metadata:
  name: depflask
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      name: {{ .Values.appName }}
  template:
    metadata:
      labels:
        name: {{ .Values.appName }}
    spec:
      containers:
      - name: flask-hello-world
        image: geektechstuff/flask-hello-world:latest
        livenessProbe:
          tcpSocket:
            port: {{ .Values.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: {{ .Values.port }}
        resources:
          requests:
            cpu: 0.2
            memory: 128Mi
          limits:
            cpu: 1.0
            memory: 256Mi
