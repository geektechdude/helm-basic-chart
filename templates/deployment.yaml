apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deploymentName }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      name: {{ .Values.appName }}
  template:
    metadata:
      labels:
        name: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.contatinerName }}
        image: {{ .Values.image.name }}:{{ .Values.image.tag }}
        livenessProbe:
          tcpSocket:
            port: {{ .Values.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 3
        ports:
        - containerPort: {{ .Values.port }}
        resources:
          requests:
            cpu: 0.2
            memory: 128Mi
          limits:
            cpu: 1.0
            memory: 256Mi
